# ATS companies configuration.
#
# Each entry must have a ``name`` and ``careers_url``. Providers are auto-detected
# from the URL pattern (greenhouse -> ashby -> lever -> workday). Set ``enabled: false``
# to skip a company.
#
# Greenhouse companies can optionally set an explicit ``api`` URL to bypass
# auto-detection, though it's not required -- the provider derives it from the
# ``careers_url`` pattern.

ats_companies:
  - name: Anthropic
    careers_url: https://job-boards.greenhouse.io/anthropic
    enabled: true

  - name: Mistral AI
    careers_url: https://jobs.lever.co/mistral
    enabled: true

  - name: Cohere
    careers_url: https://jobs.ashbyhq.com/cohere
    enabled: true

  - name: 23andMe
    careers_url: https://23andme.wd5.myworkdayjobs.com/23
    enabled: true
