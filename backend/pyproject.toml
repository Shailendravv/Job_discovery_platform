[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobctl"
version = "0.1.0"
description = "CLI driving the ATS ingestion + Claude-Code judging pipeline (PLAN.md)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "motor",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "httpx",
    # jobctl profile add (milestone 4) reuses the resume-upload endpoint's
    # text extraction (app.services.PDF_service / docx_service) — no LLM
    # call, but those modules import these at module load time.
    "pypdf",
    "pymupdf",
    "python-docx",
    "reportlab",
]

[project.scripts]
jobctl = "jobctl.__main__:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["jobctl*", "app*"]

[tool.pytest.ini_options]
# Live-network tests are opt-in only (PLAN.md §10: "Live-network tests are
# separately marked and not run by default").
addopts = "-m 'not live'"
markers = [
    "live: hits real ATS network endpoints, not run by default",
]
asyncio_mode = "auto"
testpaths = ["tests"]
